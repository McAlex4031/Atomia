<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nomenclature — ATOMIA</title>

    <style>
        :root {
            --background: #0B1020;
            --background-secondary: #11182B;
            --card: #17213A;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --accent: #38BDF8;
            --accent-dark: #0284C7;

            --border: rgba(148, 163, 184, 0.18);
            --shadow: rgba(0, 0, 0, 0.35);

            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        body.light-theme {
            --background: #F5F7FA;
            --background-secondary: #FFFFFF;
            --card: #E9EEF5;
            --text: #172033;
            --text-secondary: #526176;
            --accent: #0284C7;
            --accent-dark: #0369A1;

            --border: rgba(30, 41, 59, 0.15);
            --shadow: rgba(15, 23, 42, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            transition:
                background 0.25s ease,
                color 0.25s ease;
        }

        button,
        input {
            font: inherit;
        }

        /* =========================
           BOUTON MODE
        ========================= */

        .theme-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;

            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;

            color: var(--text);
            font-size: 1.25rem;

            cursor: pointer;

            box-shadow: 0 5px 15px var(--shadow);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 85px 16px 40px;
        }

        /* =========================
           EN-TÊTE
        ========================= */

        .page-header {
            position: relative;

            display: flex;
            align-items: center;
            gap: 16px;

            margin-bottom: 28px;
            padding: 20px;

            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow: 0 8px 25px var(--shadow);
        }

        .back-button {
            flex-shrink: 0;

            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;

            color: var(--text);
            font-size: 1.5rem;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .back-button:hover {
            transform: translateX(-3px);
            color: var(--accent);
            border-color: var(--accent);
        }

        .header-text {
            min-width: 0;
        }

        .header-text h1 {
            margin: 0;

            font-size: 1.5rem;
            line-height: 1.25;
        }

        .header-text p {
            margin: 5px 0 0;

            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* =========================
           VUES
        ========================= */

        .view {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           INTRO
        ========================= */

        .intro {
            margin-bottom: 24px;
            padding: 22px;

            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow: 0 6px 20px var(--shadow);
        }

        .intro h2 {
            margin: 0 0 8px;
            font-size: 1.25rem;
        }

        .intro p {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* =========================
           CATÉGORIES
        ========================= */

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .category-card {
            width: 100%;
            min-height: 180px;

            padding: 24px;

            text-align: left;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;

            color: var(--text);

            cursor: pointer;

            box-shadow: 0 6px 20px var(--shadow);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 28px var(--shadow);
        }

        .category-icon {
            width: 56px;
            height: 56px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: 15px;

            font-size: 1.7rem;
        }

        .category-card h3 {
            margin: 0 0 8px;
            font-size: 1.15rem;
        }

        .category-card p {
            margin: 0;

            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.92rem;
        }

        /* =========================
           CHAPITRES
        ========================= */

        .course-header {
            margin-bottom: 20px;
            padding: 20px;

            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow: 0 6px 20px var(--shadow);
        }

        .course-header h2 {
            margin: 0 0 6px;
            font-size: 1.35rem;
        }

        .course-header p {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .chapter-button {
            display: flex;
            align-items: center;
            gap: 13px;

            width: 100%;
            min-height: 72px;

            padding: 14px 16px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;

            color: var(--text);

            text-align: left;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .chapter-button:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            background: var(--background-secondary);
        }

        .chapter-number {
            flex-shrink: 0;

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;

            color: var(--accent);
            font-weight: 700;
        }

        .chapter-name {
            font-weight: 600;
            line-height: 1.35;
        }

        /* =========================
           CONTENU
        ========================= */

        .content-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 18px;
        }

        .content-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 14px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 11px;

            color: var(--text);

            cursor: pointer;

            transition:
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .content-back:hover {
            transform: translateX(-2px);
            color: var(--accent);
            border-color: var(--accent);
        }

        .search {
            flex: 1;
            min-width: 0;

            padding: 11px 14px;

            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: 11px;

            color: var(--text);

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search::placeholder {
            color: var(--text-secondary);
        }

        .search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        .chapter-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .content-section {
            padding: 20px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px;

            box-shadow: 0 6px 20px var(--shadow);
        }

        .content-section > h2 {
            margin: 0 0 15px;

            color: var(--text);
            font-size: 1.25rem;
        }

        .content-section > p {
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* =========================
           ENTRÉES DE DONNÉES
        ========================= */

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .data-entry {
            padding: 16px;

            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: 13px;
        }

        .data-entry-title {
            margin: 0 0 13px;

            color: var(--text);
            font-size: 1rem;
            font-weight: 700;
        }

        .data-fields {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .data-field {
            padding: 10px 12px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        .field-label {
            display: block;
            margin-bottom: 4px;

            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .field-value {
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* =========================
           FORMULES
        ========================= */

        .formula {
            display: inline-block;

            padding: 5px 9px;

            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 7px;

            color: var(--accent);

            font-family: "Courier New", monospace;
            font-weight: 700;
        }

        /* =========================
           RÈGLES / EXEMPLES
        ========================= */

        .rule-box,
        .example-box,
        .warning-box {
            margin-top: 12px;
            padding: 14px 15px;

            border-radius: 11px;
            line-height: 1.65;
        }

        .rule-box {
            background: rgba(56, 189, 248, 0.07);
            border-left: 3px solid var(--accent);
        }

        .example-box {
            background: rgba(34, 197, 94, 0.07);
            border-left: 3px solid var(--success);
        }

        .warning-box {
            background: rgba(245, 158, 11, 0.07);
            border-left: 3px solid var(--warning);
        }

        .box-title {
            display: block;
            margin-bottom: 5px;

            color: var(--text);
            font-weight: 700;
        }

        /* =========================
           LISTES
        ========================= */

        .clean-list {
            margin: 8px 0 0;
            padding-left: 22px;

            color: var(--text-secondary);
            line-height: 1.7;
        }

        .clean-list li {
            margin-bottom: 5px;
        }

        /* =========================
           TABLEAUX
        ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;

            margin-top: 12px;

            border: 1px solid var(--border);
            border-radius: 12px;
        }

        table {
            width: 100%;
            min-width: 500px;

            border-collapse: collapse;

            background: var(--background-secondary);
        }

        th,
        td {
            padding: 11px 13px;

            border-bottom: 1px solid var(--border);

            text-align: left;
            vertical-align: top;

            line-height: 1.5;
        }

        th {
            color: var(--text);
            background: var(--card);
        }

        td {
            color: var(--text-secondary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           CHARGEMENT / ERREUR
        ========================= */

        .loading {
            padding: 40px 20px;

            text-align: center;
            color: var(--text-secondary);
        }

        .error {
            padding: 20px;

            background: var(--card);
            border: 1px solid var(--danger);
            border-radius: 15px;

            color: var(--text);
        }

        .error strong {
            display: block;
            margin-bottom: 7px;
            color: var(--danger);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .theme-toggle {
                top: 10px;
                left: 10px;

                width: 42px;
                height: 42px;

                font-size: 1.1rem;
            }

            .page {
                padding: 70px 12px 25px;
            }

            .page-header {
                align-items: flex-start;
                padding: 17px;
                border-radius: 15px;
            }

            .back-button {
                width: 42px;
                height: 42px;
            }

            .header-text h1 {
                font-size: 1.3rem;
            }

            .category-grid {
                grid-template-columns: 1fr;
            }

            .category-card {
                min-height: 150px;
                padding: 20px;
                border-radius: 15px;
            }

            .chapter-grid {
                grid-template-columns: 1fr;
            }

            .course-header,
            .content-section,
            .intro {
                padding: 17px;
                border-radius: 15px;
            }

            .content-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .content-back {
                justify-content: center;
            }
        }

        @media (max-width: 400px) {
            .page {
                padding-left: 10px;
                padding-right: 10px;
            }

            .page-header {
                gap: 11px;
            }

            .header-text h1 {
                font-size: 1.18rem;
            }

            .header-text p {
                font-size: 0.86rem;
            }

            .category-card {
                padding: 17px;
            }

            .data-entry {
                padding: 13px;
            }
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
    </style>
</head>

<body>

    <!-- =========================
         BOUTON MODE
    ========================== -->

    <button
        id="themeToggle"
        class="theme-toggle"
        aria-label="Changer de thème"
        title="Changer de thème">
        ☀️
    </button>


    <main class="page">

        <!-- =========================
             EN-TÊTE
        ========================== -->

        <header class="page-header">

            <button
                id="backButton"
                class="back-button"
                aria-label="Retour à la bibliothèque"
                title="Retour à la bibliothèque">
                ←
            </button>

            <div class="header-text">
                <h1>ATOMIA ⚛️</h1>
                <p>Règles de nomenclature avancées</p>
            </div>

        </header>


        <!-- =========================
             VUE : CATÉGORIES
        ========================== -->

        <section id="categoryView" class="view">

            <div class="intro">
                <h2>Choisir une nomenclature</h2>

                <p>
                    Explore les règles permettant de nommer correctement
                    les espèces chimiques, des composés inorganiques
                    aux molécules organiques.
                </p>
            </div>


            <div class="category-grid">

                <button
                    class="category-card"
                    data-file="data/nomenclature_inorganique.json"
                    data-name="Nomenclature inorganique">

                    <div class="category-icon">⚗️</div>

                    <h3>Nomenclature inorganique</h3>

                    <p>
                        Éléments, ions, oxydes, acides, bases,
                        sels, hydrures, complexes et autres espèces
                        inorganiques.
                    </p>

                </button>


                <button
                    class="category-card"
                    data-file="data/nomenclature_organique.json"
                    data-name="Nomenclature organique">

                    <div class="category-icon">🧪</div>

                    <h3>Nomenclature organique</h3>

                    <p>
                        Chaînes carbonées, fonctions organiques,
                        substituants, règles de nommage et exemples.
                    </p>

                </button>

            </div>

        </section>


        <!-- =========================
             VUE : CHAPITRES
        ========================== -->

        <section id="chaptersView" class="view hidden">

            <div class="course-header">

                <h2 id="courseTitle">Nomenclature</h2>

                <p>
                    Choisis un chapitre pour consulter les règles
                    et les exemples correspondants.
                </p>

            </div>

            <div id="chapterList" class="chapter-grid"></div>

        </section>


        <!-- =========================
             VUE : CONTENU
        ========================== -->

        <section id="contentView" class="view hidden">

            <div class="content-toolbar">

                <button
                    id="contentBack"
                    class="content-back">
                    ← Chapitres
                </button>

                <input
                    id="searchInput"
                    class="search"
                    type="search"
                    placeholder="Rechercher dans ce chapitre…"
                    autocomplete="off">

            </div>

            <div id="chapterContent" class="chapter-content"></div>

        </section>

    </main>


    <script>

        /* =========================================================
           THÈME
        ========================================================= */

        const themeToggle = document.getElementById("themeToggle");

        function applyTheme(theme) {

            if (theme === "light") {
                document.body.classList.add("light-theme");
                themeToggle.textContent = "🌙";
                themeToggle.title = "Activer le mode sombre";
            } else {
                document.body.classList.remove("light-theme");
                themeToggle.textContent = "☀️";
                themeToggle.title = "Activer le mode clair";
            }

            localStorage.setItem("atomia-theme", theme);
        }


        /*
         * Sombre par défaut.
         *
         * Si un choix existe déjà dans le navigateur,
         * on le récupère.
         */

        const savedTheme = localStorage.getItem("atomia-theme");

        applyTheme(savedTheme === "light" ? "light" : "dark");


        themeToggle.addEventListener("click", () => {

            const newTheme =
                document.body.classList.contains("light-theme")
                    ? "dark"
                    : "light";

            applyTheme(newTheme);
        });


        /* =========================================================
           ÉLÉMENTS DE L'INTERFACE
           ========================================================= */

        const categoryView = document.getElementById("categoryView");
        const chaptersView = document.getElementById("chaptersView");
        const contentView = document.getElementById("contentView");

        const backButton = document.getElementById("backButton");
        const contentBack = document.getElementById("contentBack");

        const courseTitle = document.getElementById("courseTitle");
        const chapterList = document.getElementById("chapterList");
        const chapterContent = document.getElementById("chapterContent");
        const searchInput = document.getElementById("searchInput");


        let currentData = null;
        let currentCategory = "";
        let currentChapter = null;


        /* =========================================================
           TITRES LISIBLES
           ========================================================= */

        const titles = {

            meta: "Informations générales",

            systemes_de_nomenclature:
                "Systèmes de nomenclature",

            regles_generales:
                "Règles générales",

            elements:
                "Éléments",

            ions:
                "Ions",

            composes_binaires:
                "Composés binaires",

            hydrures:
                "Hydrures",

            oxydes:
                "Oxydes",

            acides:
                "Acides",

            bases:
                "Bases",

            sels:
                "Sels",

            composes_de_coordination:
                "Composés de coordination",

            composes_d_addition_et_phases_particulieres:
                "Composés d'addition et phases particulières",

            chaines_boranes_et_polyanions:
                "Chaînes boranes et polyanions",

            noms_usuels:
                "Noms usuels",

            methode_de_nommage:
                "Méthode de nommage",

            erreurs_frequentes:
                "Erreurs fréquentes",

            alcanes:
                "Alcanes",

            alcenes:
                "Alcènes",

            alcynes:
                "Alcynes",

            fonctions:
                "Fonctions organiques",

            hydrocarbures:
                "Hydrocarbures",

            substituants:
                "Substituants"
        };


        /* =========================================================
           LABELS DES CHAMPS
           ========================================================= */

        const labels = {

            nom: "Nom",
            nom_commun: "Nom commun",
            nom_systematique: "Nom systématique",

            formule: "Formule",
            formule_brute: "Formule brute",
            formule_developpee: "Formule développée",
            formule_semideveloppee: "Formule semi-développée",

            symbole: "Symbole",
            element: "Élément",
            elements: "Éléments",

            description: "Description",
            definition: "Définition",

            regle: "Règle",
            regles: "Règles",

            exemple: "Exemple",
            exemples: "Exemples",

            attention: "Attention",
            remarque: "Remarque",
            note: "Note",

            explication: "Explication",
            utilisation: "Utilisation",
            usages: "Usages",

            charge: "Charge",
            etat: "État",

            prefixe: "Préfixe",
            suffixe: "Suffixe",

            methode: "Méthode",
            etape: "Étape",
            etapes: "Étapes",

            erreur: "Erreur",
            correction: "Correction",

            categorie: "Catégorie",
            type: "Type",

            oxydation: "Nombre d'oxydation",
            nombre_oxydation: "Nombre d'oxydation",

            anion: "Anion",
            cation: "Cation"
        };


        /* =========================================================
           CONVERSION D'UN NOM TECHNIQUE EN TITRE
           ========================================================= */

        function humanize(key) {

            if (titles[key]) {
                return titles[key];
            }

            if (labels[key]) {
                return labels[key];
            }

            return key
                .replace(/_/g, " ")
                .replace(/\b\w/g, letter => letter.toUpperCase());
        }


        /* =========================================================
           DÉTECTION DES FORMULES
           ========================================================= */

        function looksLikeFormula(value, key = "") {

            if (typeof value !== "string") {
                return false;
            }

            const lowerKey = key.toLowerCase();

            if (
                lowerKey.includes("formule") ||
                lowerKey === "symbol" ||
                lowerKey === "symbole"
            ) {
                return true;
            }

            /*
             * Détection simple de formules chimiques :
             * H2O, NaCl, Fe2O3, SO4^2-, etc.
             */

            return /^[A-Z][A-Za-z0-9₀-₉()+\-^·. ]{1,25}$/.test(value)
                && /[A-Z]/.test(value)
                && /[0-9]/.test(value);
        }


        /* =========================================================
           AFFICHAGE D'UNE VALEUR SIMPLE
           ========================================================= */

        function renderValue(value, key = "") {

            if (value === null || value === undefined) {
                return "";
            }


            if (
                typeof value === "string" ||
                typeof value === "number" ||
                typeof value === "boolean"
            ) {

                const text = String(value);

                if (looksLikeFormula(text, key)) {

                    const span = document.createElement("span");

                    span.className = "formula";
                    span.textContent = text;

                    return span;
                }

                const fragment = document.createDocumentFragment();
                fragment.appendChild(document.createTextNode(text));

                return fragment;
            }


            if (Array.isArray(value)) {

                const list = document.createElement("ul");
                list.className = "clean-list";

                value.forEach(item => {

                    const li = document.createElement("li");

                    if (
                        typeof item === "string" ||
                        typeof item === "number"
                    ) {
                        li.textContent = item;
                    } else {
                        li.appendChild(renderValue(item));
                    }

                    list.appendChild(li);
                });

                return list;
            }


            if (typeof value === "object") {

                return renderObject(value);
            }


            return document.createTextNode(String(value));
        }


        /* =========================================================
           AFFICHAGE D'UN OBJET
           ========================================================= */

        function renderObject(object) {

            const wrapper = document.createElement("div");
            wrapper.className = "data-fields";

            Object.entries(object).forEach(([key, value]) => {

                /*
                 * Certains champs techniques sont moins utiles
                 * à l'utilisateur final.
                 */

                if (
                    key === "id" ||
                    key === "_id"
                ) {
                    return;
                }


                const field = document.createElement("div");
                field.className = "data-field";


                const label = document.createElement("span");
                label.className = "field-label";
                label.textContent = humanize(key);


                const content = document.createElement("div");
                content.className = "field-value";


                /*
                 * Les règles, exemples et avertissements
                 * ont une présentation spéciale.
                 */

                const lowerKey = key.toLowerCase();

                if (
                    lowerKey.includes("attention") ||
                    lowerKey.includes("warning")
                ) {

                    const box = document.createElement("div");
                    box.className = "warning-box";

                    const title = document.createElement("span");
                    title.className = "box-title";
                    title.textContent = "⚠️ Attention";

                    box.appendChild(title);
                    box.appendChild(renderValue(value, key));

                    field.appendChild(box);

                } else if (
                    lowerKey.includes("exemple") ||
                    lowerKey.includes("example")
                ) {

                    const box = document.createElement("div");
                    box.className = "example-box";

                    const title = document.createElement("span");
                    title.className = "box-title";
                    title.textContent = "💡 Exemple";

                    box.appendChild(title);
                    box.appendChild(renderValue(value, key));

                    field.appendChild(box);

                } else if (
                    lowerKey.includes("regle") ||
                    lowerKey.includes("rule")
                ) {

                    const box = document.createElement("div");
                    box.className = "rule-box";

                    const title = document.createElement("span");
                    title.className = "box-title";
                    title.textContent = "📘 Règle";

                    box.appendChild(title);
                    box.appendChild(renderValue(value, key));

                    field.appendChild(box);

                } else {

                    field.appendChild(label);
                    field.appendChild(content);

                    content.appendChild(renderValue(value, key));
                }


                wrapper.appendChild(field);
            });

            return wrapper;
        }


        /* =========================================================
           CRÉATION D'UNE ENTRÉE
           ========================================================= */

        function createEntry(data, index) {

            const entry = document.createElement("article");
            entry.className = "data-entry";


            /*
             * Si l'objet possède un nom, on l'utilise comme
             * titre de l'entrée.
             */

            if (
                data &&
                typeof data === "object" &&
                !Array.isArray(data)
            ) {

                const titleValue =
                    data.nom ||
                    data.nom_commun ||
                    data.nom_systematique ||
                    data.titre ||
                    data.name;

                if (titleValue) {

                    const title =
                        document.createElement("h3");

                    title.className = "data-entry-title";
                    title.textContent = titleValue;

                    entry.appendChild(title);
                }


                entry.appendChild(renderObject(data));

            } else {

                entry.appendChild(renderValue(data));
            }


            return entry;
        }


        /* =========================================================
           CRÉATION D'UN CHAPITRE
           ========================================================= */

        function createChapter(key, data, number) {

            const section =
                document.createElement("section");

            section.className = "content-section";

            section.dataset.searchText =
                JSON.stringify(data).toLowerCase();


            const title =
                document.createElement("h2");

            title.textContent = humanize(key);

            section.appendChild(title);


            /*
             * Tableau d'objets
             */

            if (Array.isArray(data)) {

                const list =
                    document.createElement("div");

                list.className = "data-list";

                data.forEach((item, index) => {

                    list.appendChild(
                        createEntry(item, index)
                    );

                });

                section.appendChild(list);

            }

            /*
             * Objet
             */

            else if (
                data &&
                typeof data === "object"
            ) {

                /*
                 * Certains objets sont en réalité une collection
                 * de plusieurs entrées.
                 */

                const entries =
                    Object.entries(data);

                const looksLikeCollection =
                    entries.length > 0 &&
                    entries.every(
                        ([, value]) =>
                            value &&
                            typeof value === "object" &&
                            !Array.isArray(value)
                    );


                if (looksLikeCollection) {

                    const list =
                        document.createElement("div");

                    list.className = "data-list";


                    entries.forEach(
                        ([entryKey, entryValue]) => {

                            const entry =
                                createEntry(
                                    entryValue,
                                    entryKey
                                );


                            /*
                             * Si l'objet n'a pas de nom,
                             * son propre identifiant devient
                             * un titre lisible.
                             */

                            if (
                                !entryValue.nom &&
                                !entryValue.nom_commun &&
                                !entryValue.nom_systematique &&
                                !entryValue.titre &&
                                !entryValue.name
                            ) {

                                const title =
                                    document.createElement("h3");

                                title.className =
                                    "data-entry-title";

                                title.textContent =
                                    humanize(entryKey);

                                entry.prepend(title);
                            }


                            list.appendChild(entry);
                        }
                    );


                    section.appendChild(list);

                } else {

                    section.appendChild(
                        renderObject(data)
                    );
                }

            }

            /*
             * Valeur simple
             */

            else {

                section.appendChild(
                    renderValue(data, key)
                );
            }


            return section;
        }


        /* =========================================================
           OUVRIR UNE CATÉGORIE
           ========================================================= */

        async function openCategory(file, name) {

            categoryView.classList.add("hidden");
            chaptersView.classList.remove("hidden");
            contentView.classList.add("hidden");

            courseTitle.textContent = name;

            chapterList.innerHTML =
                '<div class="loading">Chargement des chapitres…</div>';

            currentData = null;
            currentCategory = name;


            try {

                const response =
                    await fetch(file);

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                const data =
                    await response.json();

                currentData = data;


                chapterList.innerHTML = "";


                /*
                 * On ignore "meta" dans la liste des chapitres :
                 * ce sont des informations techniques générales.
                 */

                const chapters =
                    Object.entries(data)
                        .filter(
                            ([key]) =>
                                key !== "meta"
                        );


                if (chapters.length === 0) {

                    chapterList.innerHTML =
                        '<div class="loading">Aucun chapitre trouvé.</div>';

                    return;
                }


                chapters.forEach(
                    ([key], index) => {

                        const button =
                            document.createElement("button");

                        button.className =
                            "chapter-button";

                        button.dataset.chapter = key;


                        const number =
                            document.createElement("span");

                        number.className =
                            "chapter-number";

                        number.textContent =
                            index + 1;


                        const name =
                            document.createElement("span");

                        name.className =
                            "chapter-name";

                        name.textContent =
                            humanize(key);


                        button.appendChild(number);
                        button.appendChild(name);


                        button.addEventListener(
                            "click",
                            () => openChapter(key)
                        );


                        chapterList.appendChild(button);
                    }
                );

            } catch (error) {

                console.error(error);

                chapterList.innerHTML = `
                    <div class="error">
                        <strong>Impossible de charger la nomenclature</strong>
                        Vérifie que le fichier JSON existe bien à cet emplacement :
                        <br><br>
                        <code>${file}</code>
                    </div>
                `;
            }
        }


        /* =========================================================
           OUVRIR UN CHAPITRE
           ========================================================= */

        function openChapter(key) {

            if (!currentData) {
                return;
            }


            currentChapter = key;

            chaptersView.classList.add("hidden");
            contentView.classList.remove("hidden");


            searchInput.value = "";


            chapterContent.innerHTML = "";


            const section =
                createChapter(
                    key,
                    currentData[key],
                    1
                );


            chapterContent.appendChild(section);


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        /* =========================================================
           RECHERCHE DANS LE CHAPITRE
           ========================================================= */

        searchInput.addEventListener("input", () => {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const sections =
                chapterContent.querySelectorAll(
                    ".content-section"
                );


            sections.forEach(section => {

                const text =
                    section.dataset.searchText || "";


                section.style.display =
                    !query ||
                    text.includes(query)
                        ? ""
                        : "none";
            });
        });


        /* =========================================================
           BOUTONS CATÉGORIES
           ========================================================= */

        document
            .querySelectorAll(".category-card")
            .forEach(card => {

                card.addEventListener(
                    "click",
                    () => {

                        openCategory(
                            card.dataset.file,
                            card.dataset.name
                        );
                    }
                );
            });


        /* =========================================================
           RETOURS
           ========================================================= */

        /*
         * Flèche principale :
         * depuis la sélection des catégories → book.html
         *
         * Depuis les chapitres → catégories
         * Depuis le contenu → chapitres
         */

        backButton.addEventListener("click", () => {

            if (!categoryView.classList.contains("hidden")) {

                window.location.href =
                    "book.html";

                return;
            }


            if (!chaptersView.classList.contains("hidden")) {

                categoryView.classList.remove("hidden");
                chaptersView.classList.add("hidden");
                contentView.classList.add("hidden");

                return;
            }


            chaptersView.classList.remove("hidden");
            contentView.classList.add("hidden");
        });


        contentBack.addEventListener("click", () => {

            chaptersView.classList.remove("hidden");
            contentView.classList.add("hidden");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });

    </script>

</body>
</html>
