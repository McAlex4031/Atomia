<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nomenclature avancée — ATOMIA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #080b12;
            --surface: #10151f;
            --surface-2: #151c28;
            --border: #252e3d;
            --text: #f1f5f9;
            --muted: #8d99aa;
            --accent: #25c7ff;
            --accent-soft: rgba(37, 199, 255, 0.12);
            --danger: #ff6374;
            --warning: #ffc857;
            --success: #42d392;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 20;

            display: flex;
            align-items: center;
            gap: 14px;

            padding: 16px 18px;

            background: rgba(8, 11, 18, 0.94);
            backdrop-filter: blur(14px);

            border-bottom: 1px solid var(--border);
        }

        .back-button {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--surface);
            color: var(--text);

            font-size: 23px;
            cursor: pointer;

            transition: 0.2s;
        }

        .back-button:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateX(-2px);
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .header-title p {
            margin-top: 3px;
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: min(1100px, 100%);
            margin: auto;
            padding: 28px 18px 50px;
        }

        .page-intro {
            margin-bottom: 28px;
        }

        .page-intro h2 {
            font-size: clamp(28px, 6vw, 42px);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .page-intro p {
            color: var(--muted);
            max-width: 700px;
            line-height: 1.6;
        }

        /* =========================
           CATEGORY CARDS
        ========================= */

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .category-card {
            position: relative;

            min-height: 210px;
            padding: 26px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            background: linear-gradient(
                145deg,
                var(--surface-2),
                var(--surface)
            );

            border: 1px solid var(--border);
            border-radius: 22px;

            cursor: pointer;
            text-align: left;

            color: var(--text);

            transition:
                transform 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .category-icon {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: var(--accent-soft);

            font-size: 29px;
        }

        .category-card h3 {
            margin-top: 22px;
            font-size: 21px;
        }

        .category-card p {
            margin-top: 7px;

            color: var(--muted);
            line-height: 1.5;
            font-size: 14px;
        }

        .open-label {
            margin-top: 20px;

            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
        }

        /* =========================
           COURSE VIEW
        ========================= */

        #course-view {
            display: none;
        }

        .course-layout {
            display: grid;
            grid-template-columns: 270px minmax(0, 1fr);
            gap: 25px;
            align-items: start;
        }

        /* =========================
           CHAPTER MENU
        ========================= */

        .chapters {
            position: sticky;
            top: 90px;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;

            overflow: hidden;
        }

        .chapters-header {
            padding: 17px;

            border-bottom: 1px solid var(--border);

            font-size: 13px;
            font-weight: 700;
            color: var(--muted);

            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .chapter-list {
            padding: 8px;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }

        .chapter-button {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 12px;

            border: none;
            border-radius: 10px;

            background: transparent;
            color: var(--muted);

            text-align: left;
            cursor: pointer;

            transition: 0.15s;
        }

        .chapter-button:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .chapter-button.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .chapter-number {
            min-width: 27px;

            font-size: 11px;
            font-weight: 700;
            opacity: 0.8;
        }

        .chapter-name {
            font-size: 13px;
            line-height: 1.3;
        }

        /* =========================
           CONTENT
        ========================= */

        .content-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            overflow: hidden;
        }

        .content-header {
            padding: 27px;

            border-bottom: 1px solid var(--border);
        }

        .content-header .eyebrow {
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 1px;

            margin-bottom: 9px;
        }

        .content-header h2 {
            font-size: clamp(24px, 5vw, 34px);
            line-height: 1.2;
        }

        .content-body {
            padding: 27px;
        }

        /* =========================
           SECTIONS
        ========================= */

        .section {
            margin-bottom: 30px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            margin-bottom: 13px;

            font-size: 20px;
            line-height: 1.3;
        }

        .section-text {
            color: #c4ccd7;
            line-height: 1.75;
            font-size: 15px;
        }

        .subsection {
            margin-top: 22px;
        }

        .subsection-title {
            margin-bottom: 9px;
            font-size: 17px;
        }

        /* =========================
           LISTES
        ========================= */

        .content-list {
            margin-top: 10px;
            padding-left: 21px;
        }

        .content-list li {
            margin-bottom: 8px;
            color: #c4ccd7;
            line-height: 1.6;
        }

        /* =========================
           INFO BOXES
        ========================= */

        .info-box {
            margin: 17px 0;
            padding: 17px 18px;

            border-radius: 14px;

            background: var(--surface-2);
            border: 1px solid var(--border);

            line-height: 1.65;
        }

        .info-box-title {
            margin-bottom: 7px;

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .info-box.rule {
            border-left: 3px solid var(--accent);
        }

        .info-box.rule .info-box-title {
            color: var(--accent);
        }

        .info-box.example {
            border-left: 3px solid var(--success);
        }

        .info-box.example .info-box-title {
            color: var(--success);
        }

        .info-box.warning {
            border-left: 3px solid var(--warning);
        }

        .info-box.warning .info-box-title {
            color: var(--warning);
        }

        /* =========================
           TABLEAUX
        ========================= */

        .table-wrapper {
            margin-top: 15px;
            overflow-x: auto;

            border: 1px solid var(--border);
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 14px;
        }

        th {
            background: var(--surface-2);
            color: var(--accent);
            font-weight: 700;
        }

        td {
            color: #c4ccd7;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           EMPTY / ERROR
        ========================= */

        .message {
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

        .error {
            color: var(--danger);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 760px) {

            header {
                padding: 13px 14px;
            }

            main {
                padding: 22px 13px 40px;
            }

            .category-grid {
                grid-template-columns: 1fr;
            }

            .category-card {
                min-height: 185px;
            }

            .course-layout {
                grid-template-columns: 1fr;
            }

            .chapters {
                position: static;
            }

            .chapter-list {
                display: flex;
                gap: 7px;

                max-height: none;
                overflow-x: auto;
                padding: 10px;
            }

            .chapter-button {
                width: auto;
                min-width: max-content;
                white-space: nowrap;
            }

            .content-header,
            .content-body {
                padding: 21px;
            }
        }
    </style>
</head>

<body>

<header>
    <button
        class="back-button"
        id="back-button"
        aria-label="Retour"
    >
        ←
    </button>

    <div class="header-title">
        <h1>ATOMIA ⚛️</h1>
        <p>Nomenclature avancée</p>
    </div>
</header>


<main>

    <!-- =========================
         PAGE D'ACCUEIL
    ========================== -->

    <section id="home-view">

        <div class="page-intro">
            <h2>Nomenclature</h2>

            <p>
                Apprenez à nommer et à comprendre les composés
                chimiques selon les règles de nomenclature.
            </p>
        </div>

        <div class="category-grid">

            <button
                class="category-card"
                id="inorganic-button"
            >
                <div>
                    <div class="category-icon">
                        ⚗️
                    </div>

                    <h3>Nomenclature inorganique</h3>

                    <p>
                        Éléments, ions, oxydes, acides,
                        bases, sels, complexes et composés
                        inorganiques.
                    </p>
                </div>

                <span class="open-label">
                    Ouvrir la nomenclature →
                </span>
            </button>


            <button
                class="category-card"
                id="organic-button"
            >
                <div>
                    <div class="category-icon">
                        🧬
                    </div>

                    <h3>Nomenclature organique</h3>

                    <p>
                        Chaînes carbonées, fonctions organiques,
                        substituants et règles de dénomination.
                    </p>
                </div>

                <span class="open-label">
                    Ouvrir la nomenclature →
                </span>
            </button>

        </div>

    </section>


    <!-- =========================
         COURS
    ========================== -->

    <section id="course-view">

        <div class="course-layout">

            <aside class="chapters">

                <div class="chapters-header">
                    Chapitres
                </div>

                <div
                    class="chapter-list"
                    id="chapter-list"
                ></div>

            </aside>


            <article class="content-card">

                <div class="content-header">

                    <div
                        class="eyebrow"
                        id="course-type"
                    >
                        Nomenclature
                    </div>

                    <h2 id="course-title">
                        Chargement…
                    </h2>

                </div>

                <div
                    class="content-body"
                    id="course-content"
                >
                    <div class="message">
                        Chargement…
                    </div>
                </div>

            </article>

        </div>

    </section>

</main>


<script>
    /*
     * ==========================================
     * ATOMIA — NOMENCLATURE
     * ==========================================
     *
     * Les données viennent uniquement des JSON :
     *
     * data/nomenclature_inorganique.json
     * data/nomenclature_organique.json
     *
     * Cette page ne montre jamais la structure
     * brute du JSON.
     */


    const homeView = document.getElementById("home-view");
    const courseView = document.getElementById("course-view");

    const backButton = document.getElementById("back-button");

    const inorganicButton =
        document.getElementById("inorganic-button");

    const organicButton =
        document.getElementById("organic-button");

    const chapterList =
        document.getElementById("chapter-list");

    const courseTitle =
        document.getElementById("course-title");

    const courseType =
        document.getElementById("course-type");

    const courseContent =
        document.getElementById("course-content");


    let currentData = null;
    let currentChapters = [];
    let currentType = null;


    /*
     * ==========================================
     * TITRES
     * ==========================================
     */

    function formatTitle(key) {

        if (!key) return "";

        const specialCases = {
            "meta": "Informations générales",
            "systemes_de_nomenclature": "Systèmes de nomenclature",
            "regles_generales": "Règles générales",
            "elements": "Éléments",
            "ions": "Ions",
            "composes_binaires": "Composés binaires",
            "hydrures": "Hydrures",
            "oxydes": "Oxydes",
            "acides": "Acides",
            "bases": "Bases",
            "sels": "Sels",
            "composes_de_coordination": "Composés de coordination",
            "composes_d_addition_et_phases_particulieres":
                "Composés d'addition et phases particulières",
            "chaines_boranes_et_polyanions":
                "Chaînes, boranes et polyanions",
            "noms_usuels": "Noms usuels",
            "methode_de_nommage": "Méthode de nommage",
            "erreurs_frequentes": "Erreurs fréquentes"
        };

        if (specialCases[key]) {
            return specialCases[key];
        }

        return key
            .replaceAll("_", " ")
            .replace(/\b\w/g, letter => letter.toUpperCase());
    }


    /*
     * ==========================================
     * DÉTECTION DES CHAPITRES
     * ==========================================
     *
     * On ne prend pas toutes les clés du JSON.
     * Les grandes parties deviennent les chapitres.
     */

    function getChapters(data) {

        if (!data || typeof data !== "object") {
            return [];
        }

        const ignoredKeys = [
            "meta"
        ];

        return Object.entries(data)
            .filter(([key, value]) => {
                return (
                    !ignoredKeys.includes(key) &&
                    value &&
                    typeof value === "object"
                );
            })
            .map(([key, value]) => ({
                key,
                title: formatTitle(key),
                data: value
            }));
    }


    /*
     * ==========================================
     * AFFICHAGE D'UNE VALEUR
     * ==========================================
     */

    function renderValue(value) {

        if (value === null || value === undefined) {
            return "";
        }


        /*
         * TEXTE
         */

        if (typeof value === "string") {

            return `
                <p class="section-text">
                    ${escapeHTML(value)}
                </p>
            `;
        }


        /*
         * NOMBRE / BOOLÉEN
         */

        if (
            typeof value === "number" ||
            typeof value === "boolean"
        ) {

            return `
                <p class="section-text">
                    ${escapeHTML(String(value))}
                </p>
            `;
        }


        /*
         * TABLEAU
         */

        if (Array.isArray(value)) {

            /*
             * Tableau de valeurs simples
             */

            if (
                value.every(item =>
                    typeof item !== "object" ||
                    item === null
                )
            ) {

                return `
                    <ul class="content-list">
                        ${value.map(item => `
                            <li>
                                ${escapeHTML(String(item))}
                            </li>
                        `).join("")}
                    </ul>
                `;
            }


            /*
             * Tableau d'objets
             */

            return value.map(item => {

                if (
                    item &&
                    typeof item === "object"
                ) {
                    return renderObject(item, true);
                }

                return "";
            }).join("");
        }


        /*
         * OBJET
         */

        if (typeof value === "object") {
            return renderObject(value);
        }

        return "";
    }


    /*
     * ==========================================
     * OBJETS
     * ==========================================
     */

    function renderObject(object, compact = false) {

        let html = "";

        for (const [key, value] of Object.entries(object)) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                continue;
            }

            const title = formatTitle(key);


            /*
             * Champs spécialement utilisés
             * comme blocs pédagogiques.
             */

            if (
                key === "regle" ||
                key === "règle" ||
                key === "rule" ||
                key === "regles" ||
                key === "règles"
            ) {

                html += `
                    <div class="info-box rule">
                        <div class="info-box-title">
                            Règle
                        </div>

                        ${renderValue(value)}
                    </div>
                `;

                continue;
            }


            if (
                key === "exemple" ||
                key === "exemples" ||
                key === "example" ||
                key === "examples"
            ) {

                html += `
                    <div class="info-box example">
                        <div class="info-box-title">
                            Exemple
                        </div>

                        ${renderValue(value)}
                    </div>
                `;

                continue;
            }


            if (
                key === "attention" ||
                key === "remarque" ||
                key === "note" ||
                key === "notes"
            ) {

                html += `
                    <div class="info-box warning">
                        <div class="info-box-title">
                            ${title}
                        </div>

                        ${renderValue(value)}
                    </div>
                `;

                continue;
            }


            /*
             * Objet normal
             */

            if (
                typeof value === "object" &&
                !Array.isArray(value)
            ) {

                html += `
                    <section class="subsection">

                        <h3 class="subsection-title">
                            ${escapeHTML(title)}
                        </h3>

                        ${renderValue(value)}

                    </section>
                `;

            } else {

                html += `
                    <section class="section">

                        <h3 class="section-title">
                            ${escapeHTML(title)}
                        </h3>

                        ${renderValue(value)}

                    </section>
                `;
            }
        }

        return html;
    }


    /*
     * ==========================================
     * CHARGEMENT DU JSON
     * ==========================================
     */

    async function loadNomenclature(type) {

        currentType = type;

        let url;

        if (type === "inorganic") {
            url = "data/nomenclature_inorganique.json";
        } else {
            url = "data/nomenclature_organique.json";
        }


        courseContent.innerHTML = `
            <div class="message">
                Chargement de la nomenclature…
            </div>
        `;


        try {

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Impossible de charger le fichier JSON."
                );
            }

            currentData = await response.json();

            currentChapters = getChapters(currentData);


            /*
             * Change l'interface
             */

            homeView.style.display = "none";
            courseView.style.display = "block";


            courseType.textContent =
                type === "inorganic"
                    ? "Nomenclature inorganique"
                    : "Nomenclature organique";


            /*
             * Crée le menu des chapitres
             */

            renderChapterMenu();


            /*
             * Affiche le premier chapitre
             */

            if (currentChapters.length > 0) {
                openChapter(0);
            } else {

                courseTitle.textContent =
                    "Nomenclature";

                courseContent.innerHTML = `
                    <div class="message">
                        Aucun chapitre disponible.
                    </div>
                `;
            }

        } catch (error) {

            console.error(error);

            courseTitle.textContent = "Erreur";

            courseContent.innerHTML = `
                <div class="message error">
                    Impossible de charger la nomenclature.
                    <br><br>
                    Vérifie que le fichier JSON existe bien
                    dans le dossier <strong>data/</strong>.
                </div>
            `;
        }
    }


    /*
     * ==========================================
     * MENU DES CHAPITRES
     * ==========================================
     */

    function renderChapterMenu() {

        chapterList.innerHTML = "";

        currentChapters.forEach((chapter, index) => {

            const button =
                document.createElement("button");

            button.className = "chapter-button";

            button.innerHTML = `
                <span class="chapter-number">
                    ${String(index + 1).padStart(2, "0")}
                </span>

                <span class="chapter-name">
                    ${escapeHTML(chapter.title)}
                </span>
            `;

            button.addEventListener(
                "click",
                () => openChapter(index)
            );

            chapterList.appendChild(button);
        });
    }


    /*
     * ==========================================
     * OUVRIR UN CHAPITRE
     * ==========================================
     */

    function openChapter(index) {

        const chapter =
            currentChapters[index];

        if (!chapter) return;


        courseTitle.textContent =
            chapter.title;


        courseContent.innerHTML =
            renderValue(chapter.data);


        /*
         * Active le bon bouton
         */

        const buttons =
            chapterList.querySelectorAll(
                ".chapter-button"
            );

        buttons.forEach((button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );
        });


        /*
         * Sur téléphone, on remonte
         * vers le début du contenu.
         */

        if (window.innerWidth <= 760) {

            document.querySelector(
                ".content-card"
            ).scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }
    }


    /*
     * ==========================================
     * RETOUR
     * ==========================================
     */

    backButton.addEventListener(
        "click",
        () => {

            /*
             * Si on est dans un cours :
             * retour à la sélection
             */

            if (
                courseView.style.display !== "none"
            ) {

                courseView.style.display = "none";
                homeView.style.display = "block";

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

                return;
            }


            /*
             * Sinon :
             * retour à la bibliothèque.
             */

            window.location.href = "book.html";
        }
    );


    /*
     * ==========================================
     * BOUTONS PRINCIPAUX
     * ==========================================
     */

    inorganicButton.addEventListener(
        "click",
        () => loadNomenclature("inorganic")
    );

    organicButton.addEventListener(
        "click",
        () => loadNomenclature("organic")
    );


    /*
     * ==========================================
     * SÉCURITÉ HTML
     * ==========================================
     *
     * Les JSON peuvent contenir des caractères
     * comme <, > ou &.
     *
     * Cette fonction empêche leur interprétation
     * comme du HTML.
     */

    function escapeHTML(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

</script>

</body>
</html>
